<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>マイページ｜鹿児島工学院専門学校</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root{
    --navy:#24466c; --navy-2:#2f5a88; --navy-soft:#e8eef6;
    --ink:#1d2733; --sub:#5b6878; --line:#dfe5ec; --bg:#f3f6f9; --card:#fff;
    --red:#c8453c; --red-soft:#fbeceb; --amber:#b7791f; --amber-soft:#fdf3e1;
    --green:#2f855a; --green-soft:#e6f4ec;
  }
  /* 11/18：学生のページは緑系にして、保護者のページ（紺）と見分けられるようにする */
  body[data-mode="student"]{--navy:#2e7d32;--navy-2:#388e3c;--navy-soft:#e6f2e7}
  .warn-box{margin-top:10px;background:var(--amber-soft);color:#8a5a12;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
  *{box-sizing:border-box}
  .note,.notice p,.card>div{word-break:auto-phrase;text-wrap:pretty}
  html,body{margin:0}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
  header.top{
    background:var(--navy); color:#fff; padding:18px 16px 22px;
  }
  header.top .in{max-width:520px;margin:0 auto}
  .school{font-size:13px;opacity:.85;letter-spacing:.04em}
  .who{font-size:21px;font-weight:700;margin-top:4px;word-break:auto-phrase}
  .who small{font-size:14px;font-weight:500;opacity:.9;margin-left:6px}
  .meta{font-size:13px;opacity:.9;margin-top:2px}
  .asof{
    display:inline-block;margin-top:10px;background:rgba(255,255,255,.14);
    border-radius:999px;padding:3px 12px;font-size:12.5px
  }
  .upd{font-size:12px;opacity:.8;margin-top:6px}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 0;padding-bottom:2px}
  .tabs button{
    flex:0 0 auto;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;
    border-radius:999px;padding:6px 14px;font:inherit;font-size:14px
  }
  .tabs button[aria-selected="true"]{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}

  .card{
    background:var(--card);border-radius:14px;margin-top:14px;padding:16px;
    box-shadow:0 1px 2px rgba(20,40,70,.06);border:1px solid var(--line)
  }
  .card h2{
    font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--navy)
  }
  .card h2 .ic{
    width:28px;height:28px;border-radius:8px;background:var(--navy-soft);color:var(--navy);
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto
  }
  .card h2 .ic svg{width:16px;height:16px}
  .first{margin-top:-14px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{border-radius:12px;padding:10px 6px;text-align:center;background:var(--navy-soft)}
  .stat .k{font-size:13px;color:var(--sub)}
  .stat .v{font-size:28px;font-weight:700;line-height:1.2;color:var(--navy)}
  .stat .v span{font-size:13px;font-weight:500;margin-left:2px}
  .stat.warn{background:var(--amber-soft)} .stat.warn .v{color:var(--amber)}
  .note{
    margin-top:12px;font-size:13.5px;color:var(--sub);background:var(--bg);
    border-radius:10px;padding:10px 12px
  }
  .note b{color:var(--ink)}

  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{
    display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)
  }
  ul.list li:first-child{border-top:0;padding-top:2px}
  .date{flex:0 0 auto;width:78px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
  .body{flex:1;min-width:0;word-break:auto-phrase}
  .body .s{font-size:13px;color:var(--sub)}
  .tag{
    flex:0 0 auto;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px
  }
  .t-欠席{background:var(--red-soft);color:var(--red)}
  .t-遅刻{background:var(--amber-soft);color:var(--amber)}
  .t-欠課{background:var(--navy-soft);color:var(--navy)}
  .t-早退{background:var(--amber-soft);color:var(--amber)}
  .t-公欠{background:var(--green-soft);color:var(--green)}
  .t-確認中{background:var(--bg);color:var(--sub)}
  .t-済{background:var(--green-soft);color:var(--green)}
  .t-未{background:var(--red-soft);color:var(--red)}
  .empty{font-size:14px;color:var(--sub);padding:4px 0}

  .big{display:flex;align-items:baseline;gap:6px}
  .big .n{font-size:34px;font-weight:700;color:var(--navy);line-height:1.1}
  .big .u{font-size:15px;color:var(--sub)}
  .done-ok{color:var(--green);font-weight:700}

  .notice + .notice{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
  .notice .d{font-size:13px;color:var(--sub)}
  .notice .tt{font-weight:700}
  .notice p{margin:2px 0 0;font-size:14.5px}

  .pdf{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px}
  .pdf .soon{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:999px;padding:2px 10px;flex:0 0 auto}

  .btn{
    display:block;width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;
    font:inherit;font-weight:700;font-size:16px;padding:14px;text-align:center;text-decoration:none
  }
  .btn:disabled{opacity:.5}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .link{display:block;text-align:center;color:var(--navy);font-size:14px;margin-top:18px}

  .center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--navy-soft);border-top-color:var(--navy);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  label.f{display:block;font-weight:700;margin:14px 0 6px}
  input.code{
    width:100%;font:inherit;font-size:22px;letter-spacing:.12em;text-align:center;text-transform:uppercase;
    padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)
  }
  input.code:focus{outline:none;border-color:var(--navy)}
  .err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
  .ok{background:var(--green-soft);color:var(--green);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
  .steps{margin:8px 0 0;padding-left:1.3em;font-size:14.5px;color:var(--sub)}
  .steps li{margin:2px 0}
  footer{font-size:12.5px;color:var(--sub);text-align:center;margin-top:24px;line-height:1.8}
  footer a{color:var(--navy)}
  .refresh{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(29,39,51,.85);color:#fff;font-size:12.5px;border-radius:999px;padding:5px 14px;z-index:9}
  .test{background:#fff4d6;color:#7a5a00;font-size:12px;text-align:center;padding:4px}
</style>
</head>
<body>
<div class="test">試作版です（建築士専攻科は本物の出欠、それ以外の学生は架空のデータです）</div>
<div id="app">
  <div class="center"><div class="spinner"></div><div>読み込んでいます…</div></div>
</div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012649190-CZs3LmhO';
const API_URL = 'https://script.google.com/macros/s/AKfycbxJloMLStm64F2NXN9zYb4LbmKsOsdjrVr84iSaNahVKPFYZhDhle8vFRgazUiQ0qQq/exec';
const TEL = '099-281-7111';

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state = { data: null, idx: 0 };

const ICON = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
};

function center(html){ app.innerHTML = '<div class="center">' + html + '</div>'; }
function showError(msg){
  center('<div style="font-weight:700;font-size:17px">表示できませんでした</div>'
    + '<div style="color:#5b6878;font-size:14.5px;max-width:320px">' + esc(msg) + '</div>'
    + '<button class="btn" style="max-width:260px" onclick="location.reload()">もう一度読み込む</button>'
    + '<div style="font-size:13px;color:#5b6878">解決しない場合は、学校（<a href="tel:' + TEL + '">' + TEL + '</a>）へお電話ください。</div>');
}

async function api(action, extra){
  const idToken = liff.getIDToken();
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({ action, idToken }, extra || {})),
  });
  const text = await res.text();
  try{ return JSON.parse(text); }
  catch(_){ throw new Error('応答 ' + res.status + '：' + text.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,160)); }
}

/* 速さのため：前に開いたときの中身をこのスマホに覚えておき、まずそれを出してから新しい中身に入れ替える */
function myId(){ try{ const t = liff.getDecodedIDToken(); return t && t.sub; }catch(_){ return null; } }
function readSaved(){
  try{ const v = JSON.parse(localStorage.getItem('mypage_last') || 'null'); return v && v.id === myId() ? v.data : null; }catch(_){ return null; }
}
function save(data){ try{ localStorage.setItem('mypage_last', JSON.stringify({ id: myId(), data })); }catch(_){} }

async function load(){
  const saved = readSaved();
  let badge = null;
  if(saved && saved.registered){
    state.data = saved; state.idx = Math.min(state.idx, saved.people.length - 1);
    renderMypage();
    badge = document.createElement('div'); badge.className = 'refresh'; badge.textContent = '最新の内容に更新しています…';
    document.body.appendChild(badge);
  }else{
    center('<div class="spinner"></div><div>読み込んでいます…</div>');
  }
  try{
    const r = await api('me');
    if(badge) badge.remove();
    if(!r.ok) return showError(r.error);
    window.__ver = r.ver || '';
    if(!r.registered){ save(null); return renderRegister(); }
    save(r);
    const y = window.scrollY;
    state.data = r; state.idx = Math.min(state.idx, r.people.length - 1);
    renderMypage();
    if(saved) window.scrollTo(0, y);
  }catch(e){
    if(badge){ badge.textContent = '更新できませんでした（前回の内容を表示中）：' + (e && e.message ? e.message : e); badge.style.background = '#c8453c'; return; }
    showError('通信がうまくいきませんでした。電波のよいところで、もう一度お試しください。');
    const d = document.createElement('div');
    d.style.cssText = 'font-size:11px;color:#8a96a3;max-width:320px;word-break:break-all';
    d.textContent = '（試作用の詳細）' + (e && e.message ? e.message : e);
    app.querySelector('.center').appendChild(d);
  }
}

/* ---------- 登録画面 ---------- */
function renderRegister(add){
  document.body.dataset.mode = 'parent';
  app.innerHTML =
    '<header class="top"><div class="in"><div class="school">鹿児島工学院専門学校</div>'
    + '<div class="who">マイページの登録</div></div></header>'
    + '<div class="wrap"><div class="card">'
    + '<div style="font-size:15px">お手元の「登録コードのご案内」に書かれている、<b>登録コード</b>を入れてください。登録は最初の1回だけです。</div>'
    + '<label class="f" for="code">登録コード</label>'
    + '<input id="code" class="code" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="XXXX-XXXX" maxlength="12">'
    + '<div id="msg"></div>'
    + '<button id="go" class="btn" style="margin-top:14px">登録する</button>'
    + '<ul class="steps"><li>保護者用と学生用で、コードが分かれています。</li><li>保護者の方は、1人の学生につき2名まで登録できます。</li></ul>'
    + '</div>'
    + (add ? '<a class="link" href="#" onclick="renderMypage();return false;">マイページにもどる</a>' : '')
    + footer() + '</div>';
  const input = document.getElementById('code'), btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.onclick = async () => {
    const code = input.value.trim();
    if(!code){ msg.innerHTML = '<div class="err">登録コードを入れてください。</div>'; return; }
    btn.disabled = true; btn.textContent = '確認しています…'; msg.innerHTML = '';
    try{
      const r = await api('register', { code });
      if(!r.ok){ msg.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; btn.disabled = false; btn.textContent = '登録する'; return; }
      msg.innerHTML = '<div class="ok">' + esc(r.message) + '</div>';
      setTimeout(load, 900);
    }catch(e){
      msg.innerHTML = '<div class="err">通信がうまくいきませんでした。もう一度お試しください。</div>';
      btn.disabled = false; btn.textContent = '登録する';
    }
  };
}

/* ---------- マイページ ---------- */
function card(icon, title, inner, cls){
  return '<section class="card ' + (cls||'') + '"><h2><span class="ic">' + ICON[icon] + '</span>' + esc(title) + '</h2>' + inner + '</section>';
}

function renderMypage(){
  const d = state.data, p = d.people[state.idx], parent = p.種別 === '保護者';
  document.body.dataset.mode = parent ? 'parent' : 'student';
  const tabs = d.people.length > 1
    ? '<div class="tabs">' + d.people.map((x,i) => '<button aria-selected="' + (i===state.idx) + '" onclick="state.idx=' + i + ';renderMypage()">' + esc(x.氏名.replace(/（.*?）/,'')) + '</button>').join('') + '</div>'
    : '';

  const head = '<header class="top"><div class="in">'
    + '<div class="school">鹿児島工学院専門学校　' + (parent ? '保護者マイページ' : 'マイページ（学生）') + '</div>'
    + '<div class="who">' + esc(p.氏名) + '<small>さん</small></div>'
    + '<div class="meta">' + esc(p.学科) + (p.学年 ? '　' + esc(p.学年) + '年' : '') + (p.担任 ? '　担任：' + esc(p.担任) : '') + '</div>'
    + '<div class="asof">' + esc(d.asOf) + '</div>'
    + '<div class="upd">この画面の内容は、毎日1回（19:30ごろ）更新されます。</div>' + tabs + '</div></header>';

  const a = p.出欠;
  const stats = '<div class="stats">'
    + '<div class="stat"><div class="k">欠席</div><div class="v">' + a.欠席 + '<span>日</span></div></div>'
    + '<div class="stat' + (a.遅刻 >= 5 ? ' warn' : '') + '"><div class="k">遅刻</div><div class="v">' + a.遅刻 + '<span>回</span></div></div>'
    + '<div class="stat"><div class="k">欠課</div><div class="v">' + a.欠課 + '<span>コマ</span></div></div></div>'
    + '<div class="note">' + (parent
        ? '遅刻が年度内で<b>5回・7回</b>（その後は2回ごと）になった日の19:30ごろに、LINEでお知らせします。'
        : '遅刻は年度内の合計です。<b>5回・7回</b>（その後は2回ごと）になった日の19:30ごろに、保護者の方にもLINEでお知らせが届きます。')
    + '</div>';

  const recent = p.直近.length
    ? '<ul class="list">' + p.直近.map(r =>
        '<li><span class="date">' + esc(r.日付) + '</span><span class="body">' + esc(r.時限) + (r.区分 ? '<div class="s">' + esc(r.区分) + '</div>' : '') + '</span>'
        + '<span class="tag t-' + esc(r.内容) + '">' + esc(r.内容) + '</span></li>').join('') + '</ul>'
    : '<div class="empty">この2週間、欠席・遅刻・欠課はありません。</div>';

  let hoshu;
  if(parent){
    hoshu = p.補習残りコマ > 0
      ? '<div class="big"><span class="n">' + p.補習残りコマ + '</span><span class="u">コマ　残っています</span></div><div class="note">補習の日程は、担任から学生本人に伝えています。</div>'
      : '<div class="done-ok">残っている補習はありません。</div>';
  }else{
    hoshu = p.補習.length
      ? '<div class="big" style="margin-bottom:8px"><span class="n">' + p.補習残りコマ + '</span><span class="u">コマ　残り</span></div>'
        + '<ul class="list">' + p.補習.map(r =>
          '<li><span class="date">' + esc(r.授業日) + '</span><span class="body">' + esc(r.科目) + '　' + r.コマ + 'コマ'
          + (r.状態 === '済' ? '' : '<div class="s">期限 ' + esc(r.期限) + '</div>') + '</span>'
          + '<span class="tag t-' + esc(r.状態) + '">' + (r.状態 === '済' ? '済み' : 'まだ') + '</span></li>').join('') + '</ul>'
      : '<div class="done-ok">補習はありません。</div>';
  }

  const events = p.行事.length
    ? '<ul class="list">' + p.行事.map(r => '<li><span class="date">' + esc(r.日付) + '</span><span class="body">' + esc(r.行事) + '</span></li>').join('') + '</ul>'
    : '<div class="empty">予定はありません。</div>';

  const notices = p.お知らせ.length
    ? p.お知らせ.map(r => '<div class="notice"><div class="d">' + esc(r.日付) + '</div><div class="tt">' + esc(r.タイトル) + '</div><p>' + esc(r.本文) + '</p></div>').join('')
    : '<div class="empty">お知らせはありません。</div>';

  const grade = '<div class="pdf"><span>前期の成績表（PDF）</span><span class="soon">学期末に掲載</span></div>';

  // 11/18：学生のページは、提案資料の形（補習の残り → 今年度の遅刻 → 学校からの緊急連絡）に合わせる
  const n = a.遅刻, next = n < 5 ? 5 : 5 + 2 * (Math.floor((n - 5) / 2) + 1);
  const lateStu = '<div class="big"><span class="n">' + n + '</span><span class="u">回</span></div>'
    + '<div class="warn-box">あと' + (next - n) + '回（' + next + '回）になると、保護者にもLINEでお知らせが届きます。</div>'
    + '<div class="note" style="margin-top:8px">朝のSHR（9:20）に遅れると、遅刻1回に加えて欠課1コマとして数えます。</div>';
  const emergency = '<div style="font-size:15px">現在、緊急の連絡はありません。</div><div class="note">休校などのときは、LINEにも届きます。</div>';
  const body = parent
    ? card('cal', '今年度の出欠', stats, 'first')
      + card('list', '直近2週間の記録', recent)
      + card('book', '補習の残り', hoshu)
      + card('doc', '成績表', grade)
      + card('flag', '行事予定', events)
    : card('book', '補習の残り', hoshu, 'first')
      + card('cal', '今年度の遅刻', lateStu)
      + card('bell', '学校からの緊急連絡', emergency)
      + card('flag', '行事予定', events);
  app.innerHTML = head + '<div class="wrap">' + body
    /* 11/17：お知らせ欄は外した（職員の入力を増やさないため。大事な連絡は公式LINEの配信で送る） */
    + '<a class="link" href="#" onclick="renderRegister(true);return false;">' + (parent ? 'きょうだいの登録コードを追加する' : '登録コードを追加する') + '</a>'
    + footer() + '</div>';
  window.scrollTo(0,0);
}

function footer(){
  return '<footer>このページへのご質問は、学校の窓口へお電話ください。<br>'
    + '<a href="tel:' + TEL + '">' + TEL + '</a>（平日8:30〜17:00）'
    + '<div style="margin-top:8px;font-size:11px;color:#9aa5b1">画面の版：2026-11-18 版12' + (window.__ver ? '／データ係：' + esc(window.__ver) : '') + '</div></footer>';
}

  if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
  load();
}).catch(() => showError('LINEの準備ができませんでした。LINEアプリから開き直してください。'));
