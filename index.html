<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>マイページ｜鹿児島工学院専門学校</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root{
    --navy:#24466c; --navy-2:#2f5a88; --navy-soft:#e8eef6;
    --ink:#1d2733; --sub:#5b6878; --line:#dfe5ec; --bg:#f3f6f9; --card:#fff;
    --red:#c8453c; --red-soft:#fbeceb; --amber:#b7791f; --amber-soft:#fdf3e1;
    --green:#2f855a; --green-soft:#e6f4ec;
  }
  /* 11/18：学生のページは緑系にして、保護者のページ（紺）と見分けられるようにする */
  /* 11/18：学生のページは学科のイメージカラー（建築＝緑・電気＝黄・自動車＝青・ライフデザイン＝紫）。保護者のページは紺のまま */
  body[data-mode="student"][data-dept="建築"]{--navy:#2e7d32;--navy-2:#388e3c;--navy-soft:#e6f2e7}
  body[data-mode="student"][data-dept="電気"]{--navy:#8a6a00;--navy-2:#a37f00;--navy-soft:#fdf4d3;--head:#f2c230;--onhead:#3a2e00;--headchip:rgba(0,0,0,.08);--headline:rgba(0,0,0,.25)}
  body[data-mode="student"][data-dept="自動車"]{--navy:#1565c0;--navy-2:#1e78d6;--navy-soft:#e3eefb}
  body[data-mode="student"][data-dept="ライフデザイン"]{--navy:#6a3d9a;--navy-2:#7b4bb0;--navy-soft:#efe7f8}
  details.done{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  details.done summary{cursor:pointer;font-size:14px;color:var(--sub);list-style:none;padding:4px 0}
  details.done summary::before{content:'▸ ';}
  details.done[open] summary::before{content:'▾ ';}
  details.done summary::-webkit-details-marker{display:none}
  .warn-box{margin-top:10px;background:var(--amber-soft);color:#8a5a12;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
  *{box-sizing:border-box}
  .note,.notice p,.card>div{word-break:auto-phrase;text-wrap:pretty}
  html,body{margin:0}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
  header.top{
    background:var(--head, var(--navy)); color:var(--onhead, #fff); padding:18px 16px 22px;
  }
  header.top .in{max-width:520px;margin:0 auto}
  .school{font-size:13px;opacity:.85;letter-spacing:.04em}
  .who{font-size:21px;font-weight:700;margin-top:4px;word-break:auto-phrase}
  .who small{font-size:14px;font-weight:500;opacity:.9;margin-left:6px}
  .meta{font-size:13px;opacity:.9;margin-top:2px}
  .asof{
    display:inline-block;margin-top:10px;background:var(--headchip, rgba(255,255,255,.14));
    border-radius:999px;padding:3px 12px;font-size:12.5px
  }
  .upd{font-size:12px;opacity:.8;margin-top:6px}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 0;padding-bottom:2px}
  .tabs button{
    flex:0 0 auto;border:1px solid var(--headline, rgba(255,255,255,.4));background:transparent;color:inherit;
    border-radius:999px;padding:6px 14px;font:inherit;font-size:14px
  }
  .tabs button[aria-selected="true"]{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}

  .card{
    background:var(--card);border-radius:14px;margin-top:14px;padding:16px;
    box-shadow:0 1px 2px rgba(20,40,70,.06);border:1px solid var(--line)
  }
  .card h2{
    font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--navy)
  }
  .card h2 .ic{
    width:28px;height:28px;border-radius:8px;background:var(--navy-soft);color:var(--navy);
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto
  }
  .card h2 .ic svg{width:16px;height:16px}
  .first{margin-top:-14px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{border-radius:12px;padding:10px 2px;text-align:center;background:var(--navy-soft)}
  .stat .k{font-size:13px;color:var(--sub)}
  .stat .v{font-size:25px;font-weight:700;line-height:1.2;color:var(--navy)}
  .stat.pub{background:var(--green-soft)} .stat.pub .v{color:var(--green)}
  .calc{word-break:auto-phrase;margin-top:10px;border:1.5px solid var(--navy);border-radius:10px;padding:9px 12px;font-size:14.5px;color:var(--ink)}
  .calc b{color:var(--navy);font-size:17px}
  .calc .s{display:block;font-size:13px;color:var(--sub);margin-top:2px}
  dl.words{margin:10px 0 0;font-size:13px;color:var(--sub);background:var(--bg);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
  dl.words dt{font-weight:700;color:var(--ink)} dl.words dd{margin:0;word-break:auto-phrase}
  .stat .v span{font-size:13px;font-weight:500;margin-left:2px}
  .stat.warn{background:var(--amber-soft)} .stat.warn .v{color:var(--amber)}
  .note{
    margin-top:12px;font-size:13.5px;color:var(--sub);background:var(--bg);
    border-radius:10px;padding:10px 12px
  }
  .note b{color:var(--ink)}

  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{
    display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)
  }
  ul.list li:first-child{border-top:0;padding-top:2px}
  .date{flex:0 0 auto;width:78px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
  .body{flex:1;min-width:0;word-break:auto-phrase}
  .body .s{font-size:13px;color:var(--sub)}
  .tag{
    flex:0 0 auto;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px
  }
  .t-欠席{background:var(--red-soft);color:var(--red)}
  .t-遅刻{background:var(--amber-soft);color:var(--amber)}
  .t-欠課{background:var(--navy-soft);color:var(--navy)}
  .t-早退{background:var(--amber-soft);color:var(--amber)}
  .t-公欠{background:var(--green-soft);color:var(--green)}
  .t-確認中{background:var(--bg);color:var(--sub)}
  .t-済{background:var(--green-soft);color:var(--green)}
  .t-未{background:var(--red-soft);color:var(--red)}
  .empty{font-size:14px;color:var(--sub);padding:4px 0}

  .big{display:flex;align-items:baseline;gap:6px}
  .big .n{font-size:34px;font-weight:700;color:var(--navy);line-height:1.1}
  .big .u{font-size:15px;color:var(--sub)}
  .done-ok{color:var(--green);font-weight:700}

  .notice + .notice{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
  .notice .d{font-size:13px;color:var(--sub)}
  .notice .tt{font-weight:700}
  .notice p{margin:2px 0 0;font-size:14.5px}

  .pdf{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px}
  .pdf .soon{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:999px;padding:2px 10px;flex:0 0 auto}

  .btn{
    display:block;width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;
    font:inherit;font-weight:700;font-size:16px;padding:14px;text-align:center;text-decoration:none
  }
  .btn:disabled{opacity:.5}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .link{display:block;text-align:center;color:var(--navy);font-size:14px;margin-top:18px}

  .center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--navy-soft);border-top-color:var(--navy);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  label.f{display:block;font-weight:700;margin:14px 0 6px}
  input.code{
    width:100%;font:inherit;font-size:22px;letter-spacing:.12em;text-align:center;text-transform:uppercase;
    padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)
  }
  input.code:focus{outline:none;border-color:var(--navy)}
  .err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
  .ok{background:var(--green-soft);color:var(--green);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
  .steps{margin:8px 0 0;padding-left:1.3em;font-size:14.5px;color:var(--sub)}
  .steps li{margin:2px 0}
  footer{font-size:12.5px;color:var(--sub);text-align:center;margin-top:24px;line-height:1.8}
  footer a{color:var(--navy)}
  .refresh{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(29,39,51,.85);color:#fff;font-size:12.5px;border-radius:999px;padding:5px 14px;z-index:9}
  li.kday{flex-wrap:wrap;gap:6px 10px}
  .seg{display:inline-flex;border:1px solid var(--navy);border-radius:10px;overflow:hidden}
  .seg button{font:inherit;font-size:13px;border:0;background:#fff;color:var(--navy);padding:6px 7px;min-width:52px}
  .seg button+button{border-left:1px solid var(--navy)}
  .seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700}
  .seg button:disabled{opacity:.6}
  .kday .by{font-size:12px;color:var(--sub);flex-basis:100%;padding-left:88px;margin-top:-4px}
  .kday .by.none{color:var(--red)}
  button.two{font:inherit;font-size:14px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:6px 14px}
  button.two[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700}
  button.two:disabled{opacity:.6}
  .dosei{font-size:13.5px;color:var(--sub);background:var(--bg);border-radius:10px;padding:6px 12px}
  a.back{display:inline-block;color:var(--onhead,#fff);font-size:14px;font-weight:700;text-decoration:none;background:var(--headchip,rgba(255,255,255,.18));border-radius:999px;padding:4px 12px;margin-bottom:8px}
  .booked-box{background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:14px;border-radius:10px;padding:8px 12px;margin-bottom:8px}
  .cls{font-size:13px;font-weight:700;color:var(--navy);background:var(--navy-soft);border-radius:8px;padding:3px 10px;margin:10px 0 2px;display:inline-block}
  .nocome{display:inline-block;font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .plan{margin-top:8px;border-radius:10px;padding:9px 12px;font-size:14px}
  .plan.good{background:var(--green-soft);color:var(--green)}
  .plan.warn{background:var(--amber-soft);color:#8a5a12}
  .plan.bad{background:var(--red-soft);color:var(--red);font-weight:700}
  .slot.full{border-color:var(--line);color:var(--sub);background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 6px,#e4e8ee 6px,#e4e8ee 12px)}
  .form label{display:block;font-size:14px;margin-top:10px}
  .form input,.form select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
  .form label>input{display:block;width:100%;margin-top:4px}
  .row2{display:flex;align-items:center;gap:6px;margin-top:4px}.row2 input{flex:1;min-width:0}
  .band{display:flex;align-items:center;gap:6px;margin-top:6px}.band .b_name{width:64px}.band input[type=time]{flex:1;min-width:0}
  .chks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}.chk{font-size:14px;display:flex;align-items:center;gap:4px;margin:0}
  .s.booked{color:var(--navy);font-weight:700}
  button.mini{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:8px;padding:4px 8px;margin-left:6px;flex:0 0 auto}
  button.mini.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .ap{display:flex;flex:0 0 auto}
  ul.list li.bday{display:block}
  .bday .bd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px}
  .bday .late{font-size:12px;color:var(--amber)}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .slot{font:inherit;font-size:12.5px;line-height:1.35;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:8px 4px;text-align:center}
  .slot.on{background:var(--navy);color:#fff;font-weight:700}
  .slot.mine{background:var(--navy-soft);border-color:var(--navy-soft);font-weight:700}
  .slot.off{border-color:var(--line);color:var(--sub);background:var(--bg)}
  .slot small{font-size:11px;font-weight:500}
  .choose{margin-top:8px;background:var(--bg);border-radius:10px;padding:10px}
  .test{background:#fff4d6;color:#7a5a00;font-size:12px;text-align:center;padding:4px}
  /* 11/18 版43：保護者・学生への連絡 */
  .rkcls{border-top:1px solid var(--line);padding:6px 0}
  .rkcls summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-weight:700;font-size:14.5px;color:var(--navy)}
  .rkcls summary::-webkit-details-marker{display:none}
  .rkcls summary>span:first-child{flex:1;min-width:0}.rkcls summary small{font-weight:500;color:var(--sub)}
  .rkn{font-size:12.5px;color:var(--sub);font-weight:500}.rkn.on{color:var(--navy);font-weight:700}
  li.rkrow{flex-wrap:wrap;gap:6px}
  li.rkrow label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:15px}
  li.rkrow input{width:20px;height:20px;flex:0 0 auto}
  li.rkrow small{font-size:12px;color:var(--sub)}
  .rkpeek{flex-basis:100%;display:flex;gap:6px;padding-left:28px}
  .rb{flex:0 0 auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 7px}
  .rb.ok{background:var(--green-soft);color:var(--green)}.rb.no{background:var(--red-soft);color:var(--red)}.rb.wait{background:var(--amber-soft);color:var(--amber)}
  .bubble{white-space:pre-wrap;word-break:break-word;background:#e9f7e7;border-radius:14px;padding:10px 12px;font-size:14px;margin-top:4px}
  .form label.chk{display:flex}.form label.chk>input{display:inline-block;width:20px;height:20px;margin:0}
  details.fold>summary{list-style:none;cursor:pointer}details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary h2{margin:0}details.fold[open]>summary h2{margin-bottom:12px}
  .fold-hint{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--sub)}
  .fold-mark{font-size:13px;color:var(--sub);transition:transform .15s;transform:rotate(-90deg)}details.fold[open] .fold-mark{transform:none}
  .peekbar{background:#fff4d6;color:#7a5a00;font-size:13px;font-weight:700;text-align:center;padding:6px}
  .seg{flex-wrap:wrap}
</style>
</head>
<body>
<div class="test">試作版です（建築士専攻科は本物の出欠、それ以外の学生は架空のデータです）</div>
<div id="app">
  <div class="center"><div class="spinner"></div><div>読み込んでいます…</div></div>
</div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012649190-CZs3LmhO';
const API_URL = 'https://script.google.com/macros/s/AKfycbxJloMLStm64F2NXN9zYb4LbmKsOsdjrVr84iSaNahVKPFYZhDhle8vFRgazUiQ0qQq/exec';
const TEL = '099-281-7111';

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state = { data: null, idx: 0 };

const ICON = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
};

function center(html){ app.innerHTML = '<div class="center">' + html + '</div>'; }
function showError(msg){
  center('<div style="font-weight:700;font-size:17px">表示できませんでした</div>'
    + '<div style="color:#5b6878;font-size:14.5px;max-width:320px">' + esc(msg) + '</div>'
    + '<button class="btn" style="max-width:260px" onclick="location.reload()">もう一度読み込む</button>'
    + '<div style="font-size:13px;color:#5b6878">解決しない場合は、学校（<a href="tel:' + TEL + '">' + TEL + '</a>）へお電話ください。</div>');
}

async function api(action, extra){
  const idToken = liff.getIDToken();
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({ action, idToken }, extra || {})),
  });
  const text = await res.text();
  try{ return JSON.parse(text); }
  catch(_){ throw new Error('応答 ' + res.status + '：' + text.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,160)); }
}

/* 速さのため：前に開いたときの中身をこのスマホに覚えておき、まずそれを出してから新しい中身に入れ替える */
function myId(){ try{ const t = liff.getDecodedIDToken(); return t && t.sub; }catch(_){ return null; } }
function readSaved(){
  try{ const v = JSON.parse(localStorage.getItem('mypage_last') || 'null'); return v && v.id === myId() ? v.data : null; }catch(_){ return null; }
}
function save(data){ try{ localStorage.setItem('mypage_last', JSON.stringify({ id: myId(), data })); }catch(_){} }

async function load(){
  const saved = readSaved();
  let badge = null;
  if(saved && saved.registered){
    state.data = saved; state.idx = Math.min(state.idx, pages(saved) - 1);
    renderMypage();
    badge = document.createElement('div'); badge.className = 'refresh'; badge.textContent = '最新の内容に更新しています…';
    document.body.appendChild(badge);
  }else{
    center('<div class="spinner"></div><div>読み込んでいます…</div>');
  }
  try{
    const r = await api('me');
    if(badge) badge.remove();
    if(!r.ok) return showError(r.error);
    window.__ver = r.ver || '';
    if(!r.registered){ save(null); return renderRegister(); }
    save(r);
    const y = window.scrollY;
    state.data = r; state.idx = Math.min(state.idx, pages(r) - 1);
    renderMypage();
    if(saved) window.scrollTo(0, y);
  }catch(e){
    if(badge){ badge.textContent = '更新できませんでした（前回の内容を表示中）：' + (e && e.message ? e.message : e); badge.style.background = '#c8453c'; return; }
    showError('通信がうまくいきませんでした。電波のよいところで、もう一度お試しください。');
    const d = document.createElement('div');
    d.style.cssText = 'font-size:11px;color:#8a96a3;max-width:320px;word-break:break-all';
    d.textContent = '（試作用の詳細）' + (e && e.message ? e.message : e);
    app.querySelector('.center').appendChild(d);
  }
}

/* ---------- 登録画面 ---------- */
function renderRegister(add){
  document.body.dataset.mode = 'parent';
  app.innerHTML =
    '<header class="top"><div class="in"><div class="school">鹿児島工学院専門学校</div>'
    + '<div class="who">マイページの登録</div></div></header>'
    + '<div class="wrap"><div class="card">'
    + '<div style="font-size:15px">お手元の「登録コードのご案内」に書かれている、<b>登録コード</b>を入れてください。登録は最初の1回だけです。</div>'
    + '<label class="f" for="code">登録コード</label>'
    + '<input id="code" class="code" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="XXXX-XXXX" maxlength="12">'
    + '<div id="msg"></div>'
    + '<button id="go" class="btn" style="margin-top:14px">登録する</button>'
    + '<ul class="steps"><li>保護者用・学生用・先生用で、コードが分かれています。</li><li>保護者の方は、1人の学生につき2名まで登録できます。</li></ul>'
    + '</div>'
    + (add ? '<a class="link" href="#" onclick="renderMypage();return false;">マイページにもどる</a>' : '')
    + footer() + '</div>';
  const input = document.getElementById('code'), btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.onclick = async () => {
    const code = input.value.trim();
    if(!code){ msg.innerHTML = '<div class="err">登録コードを入れてください。</div>'; return; }
    btn.disabled = true; btn.textContent = '確認しています…'; msg.innerHTML = '';
    try{
      const r = await api('register', { code });
      if(!r.ok){ msg.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; btn.disabled = false; btn.textContent = '登録する'; return; }
      msg.innerHTML = '<div class="ok">' + esc(r.message) + '</div>';
      setTimeout(load, 900);
    }catch(e){
      msg.innerHTML = '<div class="err">通信がうまくいきませんでした。もう一度お試しください。</div>';
      btn.disabled = false; btn.textContent = '登録する';
    }
  };
}

// 11/19：たためるカード（タップで開く）。開いたかどうかは state.fold に覚え、画面を描き直しても開いたまま
function foldCard(key, icon, title, hint, inner){
  const open = (state.fold || {})[key];
  return '<details class="card fold"' + (open ? ' open' : '') + ' ontoggle="(state.fold=state.fold||{})[\'' + key + '\']=this.open"><summary><h2><span class="ic">' + ICON[icon] + '</span>' + esc(title)
    + '<span class="fold-hint">' + esc(hint || '') + '</span><span class="fold-mark">▾</span></h2></summary>' + inner + '</details>';
}
function card(icon, title, inner, cls){
  return '<section class="card ' + (cls||'') + '"><h2><span class="ic">' + ICON[icon] + '</span>' + esc(title) + '</h2>' + inner + '</section>';
}

// 11/18：先生として登録している人は、学生・保護者のタブの後ろに「先生用」のタブが付く（先生だけなら先生用の画面だけ）
function pages(d){ return (d.people || []).length + (d.teacher ? 1 : 0); }
function tabsHtml(d){
  if (state.peek || pages(d) < 2) return '';
  const b = (i, label) => '<button aria-selected="' + (i===state.idx) + '" onclick="state.idx=' + i + ';renderMypage()">' + esc(label) + '</button>';
  return '<div class="tabs">' + d.people.map((x,i) => b(i, x.氏名.replace(/（.*?）/,''))).join('') + (d.teacher ? b(d.people.length, '先生用') : '') + '</div>';
}
function renderMypage(){
  // 11/18 版43：先生が「保護者の画面」「学生の画面」を確かめるとき（state.peek）は、その人の画面を出す
  if (!state.peek && state.idx >= state.data.people.length) return renderTeacher();
  const pk = state.peek, d = pk ? Object.assign({}, state.data, { 公開: pk.公開 }) : state.data, p = pk ? pk.person : d.people[state.idx], parent = p.種別 === '保護者';
  document.body.dataset.mode = parent ? 'parent' : 'student';
  const dg = String(p.学科 || '');
  document.body.dataset.dept = /電気/.test(dg) ? '電気' : /自動車/.test(dg) ? '自動車' : /ライフ/.test(dg) ? 'ライフデザイン' : '建築';
  const tabs = tabsHtml(d);

  const head = (pk ? '<div class="peekbar">確認用：' + (parent ? '保護者' : '学生') + 'に見えている画面です（ボタンは押しても記録されません）</div>' : '')
    + '<header class="top"><div class="in">' + (pk ? '<a class="back" href="#" onclick="exitPeek();return false;">‹ 連絡の画面にもどる</a>' : '')
    + '<div class="school">鹿児島工学院専門学校　' + (parent ? '保護者マイページ' : 'マイページ（学生）') + '</div>'
    + '<div class="who">' + esc(p.氏名) + '<small>さん</small></div>'
    + '<div class="meta">' + esc(p.学科) + (p.学年 ? '　' + esc(p.学年) + '年' : '') + (p.担任 ? '　担任：' + esc(p.担任) : '') + '</div>'
    + (d.asOf ? '<div class="asof">' + esc(d.asOf) + '</div>' : '')
    + '<div class="upd">この画面の内容は、毎日1回（19:30ごろ）更新されます。</div>' + tabs + '</div></header>';

  const a = p.出欠;
  // 11/18：公欠を分けて出す（以前は 欠席・遅刻・欠課 の3つ）。欠課などの言葉の説明を付け、学生のページにも出す
  // 11/18：欠課6コマ＝欠席1日分を足した「出席率の計算での欠席」を、式の形で出す（池田さん：欠席3日＋欠課7コマ → 4日）
  const kk = Math.floor(a.欠課 / 6), rest = a.欠課 % 6, total = a.欠席 + kk;
  const calc = '<div class="calc">出席率の計算では <b>欠席' + total + '日</b>'

    + (parent ? '' : '<span class="s">あと' + (6 - rest) + 'コマの欠課で、<br>もう1日欠席扱いになります。</span>')
    + '</div>';
  const tiles = '<div class="stats">'
    + '<div class="stat"><div class="k">欠席</div><div class="v">' + a.欠席 + '<span>日</span></div></div>'
    + '<div class="stat pub"><div class="k">公欠</div><div class="v">' + (a.公欠 || 0) + '<span>日</span></div></div>'
    + '<div class="stat' + (a.遅刻 >= 5 ? ' warn' : '') + '"><div class="k">遅刻</div><div class="v">' + a.遅刻 + '<span>回</span></div></div>'
    + '<div class="stat"><div class="k">欠課</div><div class="v">' + a.欠課 + '<span>コマ</span></div></div></div>'
    + calc
    + '<dl class="words">'
    + '<dt>欠席</dt><dd>病気や私用などで休んだ日</dd>'
    + '<dt>公欠</dt><dd>就職試験・忌引・感染症による出席停止などで休んだ日（出席扱い）</dd>'
    + '<dt>欠課</dt><dd>授業を休んだコマ数（1コマ50分）。遅刻・早退した授業も含みます。<b>6コマで欠席1日分</b>として数えます</dd>'
    + '</dl>';
  const stats = tiles
    + '<div class="note">遅刻が年度内で<b>5回・7回</b>（その後は2回ごと）になった日の19:30ごろに、LINEでお知らせします。</div>';

  const recent = p.直近.length
    ? '<ul class="list">' + p.直近.map(r =>
        '<li><span class="date">' + esc(r.日付) + '</span><span class="body">' + esc(r.時限) + (r.区分 ? '<div class="s">' + esc(r.区分) + '</div>' : '') + '</span>'

  let hoshu;
  if(parent){
    hoshu = p.補習残りコマ > 0

      : '<div class="done-ok">残っている補習はありません。</div>';
  }else{
    // 11/18：済んだ補習は「済みの補習」に畳み、押すと開く。補習をした日も出す

    const grp = [], gi = {};
    p.補習.forEach(r => {
      const k = r.授業日 + '|' + r.科目;

      if (!(k in gi)){ gi[k] = grp.length; grp.push({ 授業日: r.授業日, 科目: r.科目, 全体: 0, 残り: 0, 済みコマ: 0, 期限: '', 実施日: [] }); }
      const g = grp[gi[k]];
      g.全体 += all; g.残り += rest; g.済みコマ += r.状態 === '済' ? all : (r.済みコマ || 0);
      if (rest && r.期限 && !g.期限) g.期限 = r.期限;
      (r.実施日 || []).forEach(x => { if (g.実施日.indexOf(x) < 0) g.実施日.push(x); });
    });
    grp.forEach(g => { g.状態 = g.残り > 0 ? '未' : '済'; g.コマ = g.残り > 0 ? g.残り : g.全体; });
    const open = grp.filter(r => r.状態 !== '済'), done = grp.filter(r => r.状態 === '済');
    const when = r => (r.実施日 && r.実施日.length) ? r.実施日.join('・') + 'に補習' : '';
    const row = r => '<li><span class="date">' + esc(r.授業日) + '</span><span class="body">' + esc(r.科目) + '　' + (r.状態 === '済' ? r.コマ : r.全体) + 'コマ'
      + (r.状態 === '済'
          ? (when(r) ? '<div class="s">' + esc(when(r)) + '</div>' : '')
          : '<div class="s">期限 ' + esc(r.期限) + '</div>'
            + (r.済みコマ ? '<div class="s">' + esc((r.実施日 || []).join('・')) + 'に' + r.済みコマ + 'コマ済み（残り' + r.コマ + '）</div>' : '')
            )
      + '</span><span class="tag t-' + esc(r.状態) + '">' + (r.状態 === '済' ? '済み' : 'まだ') + '</span></li>';
    const yoyakuBtn = p.予約 && (p.予約.残り > 0 || p.予約.一覧.length)
      ? '<button class="btn" style="margin-top:12px" onclick="state.pick=null;renderBooking()">補習を予約する・予約を見る</button>' : '';
    hoshu = p.補習.length
      ? '<div class="big" style="margin-bottom:8px"><span class="n">' + p.補習残りコマ + '</span><span class="u">コマ　残り</span></div>' + bookedList(p)
        + (open.length ? '<ul class="list">' + open.map(row).join('') + '</ul>' : '<div class="done-ok">残っている補習はありません。</div>')
        + yoyakuBtn
        + (done.length ? '<details class="done"><summary>済みの補習（' + done.length + '件）</summary><ul class="list">' + done.map(row).join('') + '</ul></details>' : '')
      : '<div class="done-ok">補習はありません。</div>';
  }

  const events = p.行事.length
    ? '<ul class="list">' + p.行事.map(r => '<li><span class="date">' + esc(r.日付) + '</span><span class="body">' + esc(r.行事) + '</span></li>').join('') + '</ul>'
    : '<div class="empty">予定はありません。</div>';

  const notices = p.お知らせ.length
    ? p.お知らせ.map(r => '<div class="notice"><div class="d">' + esc(r.日付) + '</div><div class="tt">' + esc(r.タイトル) + '</div><p>' + esc(r.本文) + '</p></div>').join('')
    : '<div class="empty">お知らせはありません。</div>';

  const grade = '<div class="pdf"><span>前期の成績表（PDF）</span><span class="soon">学期末に掲載</span></div>';

  // 11/18：学生のページは、提案資料の形（補習の残り → 今年度の遅刻 → 学校からの緊急連絡）に合わせる
  const n = a.遅刻, next = n < 5 ? 5 : 5 + 2 * (Math.floor((n - 5) / 2) + 1);
  const lateStu = tiles
    + '<div class="warn-box">遅刻はあと' + (next - n) + '回（' + next + '回）になると、保護者にもLINEでお知らせが届きます。</div>'
    + '<div class="note" style="margin-top:8px">朝のSHR（9:20）に遅れると、遅刻1回に加えて欠課1コマとして数えます。</div>';
  const emergency = '<div style="font-size:15px">現在、緊急の連絡はありません。</div><div class="note">休校などのときは、LINEにも届きます。</div>';
  // 11/18：公開設定でチェックを外した項目は「準備中」と出す（データ係はその項目のデータを返さない）
  const 公 = d.公開 || {};
  const on = k => 公[k] !== false;
  const soon = '<div class="empty">準備中です。公開まで、もうしばらくお待ちください。</div>';
  const pick = (k, html) => on(k) ? html : soon;
  // 11/18：三者面談の予約（案内が届いたクラスだけ）。保護者は一番上に出す
  const mendan = p.面談 ? card('flag', '三者面談', mendanParent(p)) : '';
  // 11/18 版43：学校からの連絡（先生・事務が先生用の画面から送ったもの）。「確認しました」がまだのものがあれば一番上、なければ出欠の下
  const rk = renrakuCard(p), rkTop = (p.連絡 || []).some(x => x.確認つき && !x.確認済み);
  const secs = parent
    ? [rkTop ? rk : '', mendan, card('cal', '今年度の出欠', pick('出欠', stats)), rkTop ? '' : rk,
       on('直近の記録') ? card('list', '直近2週間の記録', recent) : '',
       card('book', '補習の残り', pick('補習', hoshu)), card('doc', '成績表', pick('成績表', grade)), card('flag', '行事予定', pick('行事予定', events))]
    /* 11/18：学生も「今年度の出欠」を一番上に（以前は 補習の残り → 今年度の遅刻 の順） */
    /* 11/18：「学校からの緊急連絡」の欄は外した → 版43で、送った連絡を「学校からの連絡」として出す形に */
    : [rkTop ? rk : '', card('cal', '今年度の出欠', pick('出欠', lateStu)), rkTop ? '' : rk, card('book', '補習の残り', pick('補習', hoshu)), mendan, card('flag', '行事予定', pick('行事予定', events))];
  const body = secs.filter(Boolean).map((h, i) => i ? h : h.replace('class="card ', 'class="card first ')).join('');
  app.innerHTML = head + '<div class="wrap">' + body
    /* 11/17：お知らせ欄は外した（職員の入力を増やさないため。大事な連絡は公式LINEの配信で送る） */
    + (pk ? '<a class="link" href="#" onclick="exitPeek();return false;">連絡の画面にもどる</a>' : '<a class="link" href="#" onclick="renderRegister(true);return false;">' + (parent ? 'きょうだいの登録コードを追加する' : '登録コードを追加する') + '</a>')
    + footer() + '</div>';
  window.scrollTo(0,0);
}

/* ---------- 先生用の画面（11/18） ----------

function dayStatus(x){

}
function renderTeacher(){

async function setTwo(i){
  const t = state.data.teacher, x = t.放課後[i], want = !x.二コマ;
  const btn = app.querySelectorAll('li.kday')[i].querySelector('button.two');
  btn.disabled = true; btn.setAttribute('aria-pressed', String(want)); btn.textContent = want ? '✓ 2コマ残れる' : '2コマ残れる';
  try{
    const r = await api('hoshu_day', { date: x.日付, koma: want ? 2 : 1 });
    if (!r.ok) throw new Error(r.error);
    x.二コマ = r.二コマ; x.その日 = r.その日; x.二コマの先生 = r.二コマの先生; save(state.data);
    const y = window.scrollY; renderTeacher(); window.scrollTo(0, y);
    toast(x.表示 + (want ? '：2コマ残れる' : '：取り消しました'));
  }catch(e){
    btn.disabled = false; btn.setAttribute('aria-pressed', String(!want)); btn.textContent = !want ? '✓ 2コマ残れる' : '2コマ残れる';
    toast('入れられませんでした：' + (e && e.message ? e.message : e), true);

}

/* ---------- 補習の予約（学生・11/18） ---------- */
const STATE_LABEL = { 確定: '予約済み', 承認待ち: '承認待ち' };
function curPerson(){ return state.peek ? state.peek.person : state.data.people[state.idx]; }

// 11/18：見通し（いつ残りがなくなるか・期限に間に合うか）
function mitooshi(y){
  const m = y.見通し;
  if (!m) return '<div class="note" style="margin-top:0">補習の残り：<b>' + y.残り + 'コマ</b>（あと<b>' + y.予約できる数 + 'コマ</b>予約できます）。</div>';
  let line;
  if (m.残り <= 0) line = '<div class="ok" style="margin-top:0">残っている補習はありません。</div>';
  else if (m.足りない > 0) line = '<div class="plan warn">あと<b>' + m.足りない + 'コマ</b>予約すると、残りがすべて埋まります。</div>';
  else line = '<div class="plan ' + (m.間に合わない.length ? 'warn' : 'good') + '"><b>' + esc(m.終わる日) + '</b>に残りがなくなります' + (m.承認待ち ? '（承認待ち' + m.承認待ち + 'コマが承認されれば）' : '') + '。</div>';
  // 11/18：期限に遅れても罰はないので、強い言い方・赤字はやめて「担任に相談」に（以前は「もっと早い日を予約してください」の赤字）
  const late = m.間に合わない.map(x => '<div class="plan warn">' + esc(x.科目) + 'の期限（' + esc(x.期限) + '）に間に合わない見込みです。担任の先生に相談してください。</div>').join('');
  return '<div class="note" style="margin-top:0">補習の残り：<b>' + m.残り + 'コマ</b>' + (m.近い期限 ? '　いちばん近い期限：<b>' + esc(m.近い期限) + '</b>' : '')
    + '<br>予約：' + m.予約数 + 'コマ' + (m.承認待ち ? '（うち承認待ち' + m.承認待ち + '）' : '') + '。どの補習を消化するかは、当日先生が決めます。</div>'
    + line + late;
}
function slotLabel(t){ const m = String(t).match(/^(.*?)（(.*)）$/); return m ? esc(m[1]) + '<br><small>' + esc(m[2]) + '</small>' : esc(t); }
function renderBooking(){
  const d = state.data, p = curPerson(), y = p.予約;
  // 11/18：もどるボタンを上にも付けた（以前は一番下だけ）
  const head = '<header class="top"><div class="in"><a class="back" href="#" onclick="renderMypage();return false;">‹ マイページにもどる</a><div class="school">鹿児島工学院専門学校　マイページ（学生）</div>'
    + '<div class="who">補習の予約</div><div class="meta">' + esc(p.氏名) + 'さん</div></div></header>';
  const mine = y.一覧.length
    ? '<ul class="list">' + y.一覧.map(b => '<li><span class="date">' + esc(b.日付) + '</span><span class="body">' + esc(b.枠.replace(/（.*$/, '')) + '<div class="s">' + esc((b.枠.match(/（(.*)）/) || ['', ''])[1]) + '</div></span>'
        + '<span class="tag ' + (b.状態 === '確定' ? 't-済' : 't-確認中') + '">' + STATE_LABEL[b.状態] + '</span>'
        + (b.取り消せる ? '<button class="mini" onclick="cancelBooking(\'' + esc(b.id) + '\')">取り消す</button>' : (b.承認した先生 ? '<div class="s" style="flex-basis:100%">取り消すときは、' + esc(b.承認した先生) + '先生か担任の先生に連絡</div>' : '')) + '</li>').join('') + '</ul>'
    : '<div class="empty">予約している補習はありません。</div>';
  const pick = state.pick;
  const days = y.日.map((x, di) => '<li class="bday"><div class="bd"><b>' + esc(x.表示) + '</b>'
      + '</div><div class="slots">'
      + x.枠.map((w, wi) => {
          if (w.予約) return '<span class="slot mine">' + esc(w.表示.replace(/（.*$/, '')) + '<br><small>' + STATE_LABEL[w.予約.状態] + '</small></span>';
          if (w.理由) return '<span class="slot off">' + esc(w.表示.replace(/（.*$/, '')) + '<br><small>' + esc(w.理由) + '</small></span>';
          const on = pick && pick.di === di && pick.wi === wi;
          return '<button class="slot' + (on ? ' on' : '') + '" onclick="pickSlot(' + di + ',' + wi + ')">' + slotLabel(w.表示) + '</button>';
        }).join('') + '</div>'
      + (pick && pick.di === di ? choosePanel(x, x.枠[pick.wi]) : '') + '</li>').join('');
  const can = (y.予約できる数 > 0 || y.一覧.length)
    ? '<div class="note" style="margin-top:0;margin-bottom:10px">朝補習・放課後1コマ目は、その場で決まります。<b>放課後2コマ目は、先生の承認待ち</b>になります。取り消しは補習が始まる時間まで（承認済みの2コマ目は取り消せません。先生に連絡してください）。'
      + (y.承認制 ? '<br><b>「来なかった」が' + y.来なかった + '回になったため、予約はすべて承認待ちになります。</b>' : '') + '</div><ul class="list">' + days + '</ul>'
    : '<div class="empty">予約できる補習は残っていません。</div>';
  const left = mitooshi(y);
  app.innerHTML = head + '<div class="wrap">'
    + card('book', '予約した補習', left + '<div style="margin-top:10px">' + mine + '</div>', 'first')
    + card('cal', '予約できる日', can)
    + '<a class="link" href="#" onclick="renderMypage();return false;">マイページにもどる</a>' + footer() + '</div>';
}
function choosePanel(day, w){
  return '<div class="choose"><button class="btn" style="padding:11px" onclick="book(\'' + esc(day.日付) + '\',\'' + esc(w.枠) + '\')">'
    + 'この時間で予約する</button>'
    + (w.枠 === '放課後2' ? '<div class="s" style="margin-top:6px;color:var(--amber)">2コマ目は、先生が承認したら決まります</div>' : '') + '</div>';
}
function pickSlot(di, wi){
  const y = window.scrollY;
  state.pick = (state.pick && state.pick.di === di && state.pick.wi === wi) ? null : { di, wi };
  renderBooking(); window.scrollTo(0, y);
}
async function reloadKeep(fn){
  const y = window.scrollY;
  const r = await api('me'); if (!r.ok) throw new Error(r.error);
  save(r); state.data = r; fn(); window.scrollTo(0, y);
}
async function book(date, slot){
  if (state.peek) return toast('確認用の画面では予約できません', true);
  const p = curPerson();
  app.querySelectorAll('.choose button').forEach(b => b.disabled = true);
  try{
    const r = await api('book', { sid: p.学籍番号, date, slot });
    if (!r.ok) throw new Error(r.error);
    state.pick = null; await reloadKeep(renderBooking); toast(r.message, r.状態 !== '確定' ? false : false);
  }catch(e){ toast(String(e && e.message ? e.message : e), true); app.querySelectorAll('.choose button').forEach(b => b.disabled = false); }
}
async function cancelBooking(id){
  if (state.peek) return toast('確認用の画面では取り消せません', true);
  try{
    const r = await api('cancel', { id });
    if (!r.ok) throw new Error(r.error);
    await reloadKeep(renderBooking); toast(r.message);
  }catch(e){ toast(String(e && e.message ? e.message : e), true); }
}
/* ---------- 先生：予約の一覧と承認（11/18） ---------- */
function teacherBookings(){
  const y = state.data.teacher.予約;
  if (!y) return { next: '<div class="empty">読み込めませんでした。</div>', wait: '' };
  // 11/18：「残りの補習：法規1・構造2」は紛らわしいので出さない
  const li = (b, btn) => '<li><span class="date">' + esc(b.日付) + '</span><span class="body">' + esc(b.氏名) + '<div class="s">' + esc(b.枠) + '</div>'
    + (b.状態 === '確定' && b.処理した先生 ? '<div class="s">承認：' + esc(b.処理した先生) + '</div>' : '') + '</span>'
    + (btn || '<span class="tag ' + (b.状態 === '確定' ? 't-済' : 't-確認中') + '">' + STATE_LABEL[b.状態] + '</span>') + '</li>';
  // 11/18：クラス（1年・2年・専攻科）ごとにまとめる
  const byClass = (list, f) => {
    const g = {}; list.forEach(b => { const k = b.クラス || 'その他'; (g[k] = g[k] || { 並び: b.並び || 5, list: [] }).list.push(b); });
    return Object.keys(g).sort((a, c) => g[a].並び - g[c].並び || (a < c ? -1 : 1))
      .map(k => '<div class="cls">' + esc(clsLabel(k)) + '（' + g[k].list.length + '件）</div><ul class="list">' + g[k].list.map(f).join('') + '</ul>').join('');
  };
  const next = y.次の日の予約.length ? byClass(y.次の日の予約, b => li(b)) : '<div class="empty">' + esc(y.次の日) + 'の補習の予約はありません。</div>';
  const wait = y.承認待ち.length ? byClass(y.承認待ち, b => li(b, !b.押せる ? '<span class="tag t-確認中">担任が確認</span>' : '<span class="ap"><button class="mini on" onclick="approve(\'' + esc(b.id) + '\',true)">承認</button><button class="mini" onclick="approve(\'' + esc(b.id) + '\',false)">しない</button></span>')) : '<div class="empty">承認待ちの予約はありません。</div>';
  return { next, wait, title: y.次の日 + 'の補習の予約' };
}
function clsLabel(c){ c = String(c); if (/専攻|養成/.test(c)) return c; const m = c.match(/\d/); return m ? m[0] + '年（' + c + '）' : c; }
async function approve(id, yes){
  try{
    const r = await api('approve', { id, yes });
    if (!r.ok) throw new Error(r.error);
    await reloadKeep(renderTeacher); toast(r.message);
  }catch(e){ toast(String(e && e.message ? e.message : e), true); }
}

/* ---------- 三者面談（11/18） ---------- */
function mendanParent(p){
  const m = p.面談;
  let h = '<div class="note" style="margin-top:0">期間：<b>' + esc(m.期間) + '</b><br>予約の締め切り：<b>' + esc(m.締め切り) + '</b>（締め切りまではここで変更できます）</div>';
  h += m.予約 ? '<div class="plan good">予約：<b>' + esc(m.予約) + '</b></div>' : (m.学生 ? '<div class="plan warn">まだ予約されていません（保護者の方が予約します）。</div>' : '<div class="plan warn">まだ予約されていません。下から日時を選んでください。</div>');
  if (m.学生) return h;
  if (m.締め切り後) return h + '<div class="note">予約の締め切りを過ぎました。変更は学校（<a href="tel:' + TEL + '">' + TEL + '</a>）へお電話ください。</div>';
  if (m.予約) h += '<button class="btn ghost" style="margin-top:10px;padding:10px" onclick="mendanCancel(\'' + esc(p.学籍番号) + '\')">予約を取り消す</button>';
  h += '<div class="s" style="margin:12px 0 4px;font-weight:700">' + (m.予約 ? '日時を変える' : '日時を選ぶ') + '</div>';
  h += (m.日 || []).length ? '<ul class="list">' + m.日.map(d => '<li class="bday"><div class="bd"><b>' + esc(d.表示) + '</b></div><div class="slots">'
      + d.枠.map(w => w.自分 ? '<span class="slot mine">' + esc(w.表示.replace(/（.*$/, '')) + '<br><small>予約中</small></span>'
        : w.満 ? '<span class="slot full">' + esc(w.表示.replace(/（.*$/, '')) + '<br><small>予約済み</small></span>'
        : '<button class="slot" onclick="mendanBook(\'' + esc(p.学籍番号) + '\',\'' + esc(d.日付) + '\',\'' + esc(w.id) + '\',this)">' + esc(w.表示.replace(/（.*$/, '')) + '</button>').join('') + '</div></li>').join('') + '</ul>'
    : '<div class="empty">選べる日時が残っていません。学校へお電話ください。</div>';
  return h;
}
async function mendanBook(sid, date, slot, btn){
  if (state.peek) return toast('確認用の画面では予約できません', true);
  if (btn.dataset.sure !== '1') { app.querySelectorAll('.slot[data-sure="1"]').forEach(b => { b.dataset.sure = ''; b.classList.remove('on'); }); btn.dataset.sure = '1'; btn.classList.add('on'); toast('もう一度押すと、この日時で予約します'); return; }
  btn.disabled = true;
  try { const r = await api('mendan_book', { sid, date, slot }); if (!r.ok) throw new Error(r.error); await reloadKeep(renderMypage); toast(r.message); }
  catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}
async function mendanCancel(sid){
  if (state.peek) return toast('確認用の画面では取り消せません', true);
  try { const r = await api('mendan_cancel', { sid }); if (!r.ok) throw new Error(r.error); await reloadKeep(renderMypage); toast(r.message); }
  catch(e){ toast(String(e && e.message ? e.message : e), true); }
}
function mendanHint(m){
  if (!m || m.エラー) return '';
  if (!m.設定) return m.設定できる ? 'まだ設定がありません' : '準備中';
  const c = m.クラス || [];
  return c.length ? c.map(x => '予約 ' + x.予約数 + '/' + x.対象数).join('・') : String(m.設定.始め).slice(5).replace('-', '/') + '〜';
}
function mendanTeacher(m){
  if (!m) return '<div class="empty">読み込めませんでした。</div>';
  if (m.エラー) return '<div class="err">' + esc(m.エラー) + '</div>';
  let h = '';
  const st = m.設定;
  if (st) h += '<div class="note" style="margin-top:0">期間：<b>' + esc(st.始め) + '〜' + esc(st.終わり) + '</b>　締め切り：<b>' + esc(st.締め切り表示) + '</b><br>面談' + st.長さ + '分・間の準備' + st.準備 + '分　対象：' + esc(st.対象.join('・') || 'なし') + '</div>';
  else h += '<div class="note" style="margin-top:0">まだ今年度の設定がありません。' + (m.設定できる ? '下の「設定」から入れてください。' : '科長が設定します。') + '</div>';
  if (m.設定できる) h += mendanSettingForm(m);
  (m.クラス || []).forEach((c, ci) => {
    h += '<div class="cls" style="margin-top:14px">' + esc(c.クラス) + '：予約 ' + c.予約数 + '/' + c.対象数 + '人</div>'
      + '<div style="margin-top:6px;font-size:13.5px">同じ時間に面談する場所の数 <select onchange="mendanRooms(\'' + esc(c.クラス) + '\',this.value,this)">' + [1, 2, 3, 4].map(n => '<option' + (c.部屋 === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>か所<span style="color:var(--sub)">（副担任と分けるときなど）</span></div>'
      + '<div style="margin:4px 0 8px;font-size:13px;color:var(--sub)">NGの日・時間を押して外してください（もう一度押すと戻ります）。' + (c.案内 ? '<br>保護者への案内：' + esc(c.案内) + ' に送りました' : '') + '</div>';
    h += '<ul class="list">' + c.日.map((d, di) => '<li class="bday"><div class="bd"><b>' + esc(d.表示) + '</b><button class="mini' + (d.終日NG ? ' on' : '') + '" onclick="mendanNg(\'' + esc(c.クラス) + '\',\'' + esc(d.日付) + '\',\'*\',this)">' + (d.終日NG ? 'この日はNG' : 'この日を全部NG') + '</button></div>'
      + (d.終日NG ? '' : '<div class="slots">' + d.枠.map(w => w.満 ? '<span class="slot mine">' + esc(w.表示.replace(/（.*$/, '')) + '<br><small>' + esc(w.予約.join('・')) + '</small></span>'
          : '<button class="slot' + (w.NG ? ' off' : '') + '" onclick="mendanNg(\'' + esc(c.クラス) + '\',\'' + esc(d.日付) + '\',\'' + esc(w.id) + '\',this)">' + esc(w.表示.replace(/（.*$/, '')) + '<br><small>' + (w.NG ? 'NG' : w.予約.length ? esc(w.予約.join('・')) + '（あと' + (c.部屋 - w.予約.length) + '）' : '') + '</small></button>').join('') + '</div>') + '</li>').join('') + '</ul>';
    h += '<button class="btn" style="margin-top:10px" onclick="mendanSend(\'' + esc(c.クラス) + '\',this)">' + (c.案内 ? '保護者にもう一度案内を送る' : '保護者に案内を送る') + '</button>';
    // 11/18：名簿で学生ごとに「面談あり／なし」（卒業する学生などを外す）。案内は「あり」の保護者だけに届く
    h += '<details class="done" open><summary>名簿（面談あり／なし・予約の状況）</summary><div style="margin-top:6px;font-size:13px;color:var(--sub)">面談のない学生（卒業する学生など）は「なし」にしてください。</div><ul class="list">'
      + c.名簿.map(x => '<li><span class="body"' + (x.対象 ? '' : ' style="color:var(--sub);text-decoration:line-through"') + '>' + esc(x.氏名) + (x.対象 && x.予約 ? '<div class="s">' + esc(x.予約.replace(/（[^）]*）$/, '')) + '</div>' : '') + '</span>'
        + (x.対象 && !x.予約 ? '<span class="tag t-未">まだ</span>' : '')
        + '<button class="mini' + (x.対象 ? ' on' : '') + '" onclick="mendanTarget(\'' + esc(c.クラス) + '\',\'' + esc(x.sid) + '\',this)">' + (x.対象 ? '面談あり' : 'なし') + '</button></li>').join('') + '</ul></details>';
  });
  if (st && !(m.クラス || []).length) h += '<div class="empty" style="margin-top:10px">担任をしている対象のクラスはありません。</div>';
  return h;
}
function mendanSettingForm(m){
  const st = m.設定 || {}, 帯 = (st.時間帯 && st.時間帯.length) ? st.時間帯 : m.初期の時間帯;
  const opt = (vals, cur) => vals.map(v => '<option value="' + v + '"' + (Number(cur) === v ? ' selected' : '') + '>' + v + '分</option>').join('');
  return '<details class="done" ' + (m.設定 ? '' : 'open') + '><summary>設定（科長）</summary><div class="form" id="mset">'
    + '<label>期間<span class="row2"><input type="date" id="ms_s" value="' + esc(st.始め || '') + '"> 〜 <input type="date" id="ms_e" value="' + esc(st.終わり || '') + '"></span></label>'
    + '<label>予約の締め切り<input type="datetime-local" id="ms_d" value="' + esc(st.締め切り || '') + '"></label>'
    + '<label>面談の長さ<select id="ms_l">' + opt([10, 15, 20, 25, 30, 40, 50], st.長さ || 20) + '</select>　間の準備<select id="ms_p">' + opt([0, 5, 10, 15], st.準備 === undefined ? 5 : st.準備) + '</select></label>'
    + '<div class="s" style="font-weight:700;margin-top:8px">時間帯（この中を「長さ＋準備」で区切って枠にします）</div><div id="ms_t">'
    + 帯.map(x => bandRow(x)).join('') + '</div><button class="mini" onclick="document.getElementById(\'ms_t\').insertAdjacentHTML(\'beforeend\', bandRow({名:\'\',始:\'\',終:\'\',使う:true}))">＋ 時間帯を足す</button>'
    + '<div class="s" style="font-weight:700;margin-top:10px">対象のクラス（卒業学年は外す）</div><div class="chks">'
    + m.学科のクラス.map(c => '<label class="chk"><input type="checkbox" value="' + esc(c) + '"' + ((st.対象 || []).includes(c) ? ' checked' : '') + '> ' + esc(c) + '</label>').join('') + '</div>'
    + '<button class="btn" style="margin-top:12px" onclick="mendanSave(this)">設定を保存する</button></div></details>';
}
function bandRow(x){
  return '<div class="band"><input type="checkbox" class="b_use"' + (x.使う !== false ? ' checked' : '') + '><input class="b_name" placeholder="名前" value="' + esc(x.名 || '') + '"><input type="time" class="b_s" value="' + esc(x.始 || '') + '">〜<input type="time" class="b_e" value="' + esc(x.終 || '') + '"></div>';
}
async function mendanSave(btn){
  const v = id => document.getElementById(id).value;
  const 時間帯 = [...document.querySelectorAll('#ms_t .band')].map(b => ({ 使う: b.querySelector('.b_use').checked, 名: b.querySelector('.b_name').value, 始: b.querySelector('.b_s').value, 終: b.querySelector('.b_e').value })).filter(x => x.始 && x.終);
  const 対象 = [...document.querySelectorAll('#mset .chks input:checked')].map(x => x.value);
  btn.disabled = true;
  try { const r = await api('mendan_setting', { 始め: v('ms_s'), 終わり: v('ms_e'), 締め切り: v('ms_d'), 長さ: v('ms_l'), 準備: v('ms_p'), 時間帯, 対象 }); if (!r.ok) throw new Error(r.error); await reloadKeep(renderTeacher); toast(r.message); }
  catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}
async function mendanNg(cls, date, slot, btn){
  btn.disabled = true;
  try { const r = await api('mendan_ng', { cls, date, slot }); if (!r.ok) throw new Error(r.error); await reloadKeep(renderTeacher); }
  catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}
async function mendanTarget(cls, sid, btn){
  btn.disabled = true;
  try { const r = await api('mendan_target', { cls, sid }); if (!r.ok) throw new Error(r.error); await reloadKeep(renderTeacher); }
  catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}
async function mendanRooms(cls, n, sel){
  sel.disabled = true;
  try { const r = await api('mendan_rooms', { cls, n }); if (!r.ok) throw new Error(r.error); await reloadKeep(renderTeacher); toast('同じ時間に' + n + 'か所にしました'); }
  catch(e){ sel.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}
async function mendanSend(cls, btn){
  if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'もう一度押すと、' + cls + 'の保護者にLINEを送ります'; return; }
  btn.disabled = true;
  try { const r = await api('mendan_send', { cls }); if (!r.ok) throw new Error(r.error); await reloadKeep(renderTeacher); toast(r.message); }
  catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}

/* ---------- 学校からの連絡（受け取る側・11/18 版43） ---------- */
function renrakuCard(p){
  const list = p.連絡 || [];
  if (!list.length) return '';
  const item = r => '<div class="notice"><div class="d">' + esc(r.日時) + (r.種類 === '緊急' ? ' <span class="tag t-欠席">緊急</span>' : '') + '</div>'
    + '<div class="tt">' + esc(r.タイトル) + '</div><p style="white-space:pre-wrap">' + esc(r.本文) + '</p>'
    + '<div style="font-size:12.5px;color:var(--sub);margin-top:2px">' + esc(r.差出人) + '</div>'
    + (r.確認つき ? (r.確認済み ? '<div class="ok" style="margin-top:6px;padding:6px 10px">確認しました</div>'
        : '<button class="btn" style="margin-top:8px;padding:10px" onclick="renrakuOk(\'' + esc(r.id) + '\',this)">確認しました</button>') : '') + '</div>';
  const head = list.slice(0, 3), rest = list.slice(3);
  return card('bell', '学校からの連絡', head.map(item).join('')
    + (rest.length ? '<details class="done"><summary>以前の連絡（' + rest.length + '件）</summary>' + rest.map(item).join('') + '</details>' : ''));
}
async function renrakuOk(id, btn){
  if (state.peek) return toast('確認用の画面です（押しても記録されません）', true);
  const p = curPerson(); btn.disabled = true;
  try{
    const r = await api('renraku_ok', { id, sid: p.学籍番号 }); if (!r.ok) throw new Error(r.error);
    (p.連絡 || []).forEach(x => { if (x.id === id) x.確認済み = true; }); save(state.data);
    const y = window.scrollY; renderMypage(); window.scrollTo(0, y); toast(r.message);
  }catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}

/* ---------- 先生：保護者・学生への連絡（11/18 版43） ----------
 * 宛先は学生ごとにチェック（クラスごとに全員も）。保護者・学生・両方を選ぶ。よく使う宛先はグループに保存。
 * 送る前に、届く数・未登録の人・LINEの文を確かめてから、2回押して送る */
const RK_NEW = () => ({ 種類: 'お知らせ', 相手: '保護者', タイトル: '', 本文: '', 確認: false });
function rkState(){ return state.rk || (state.rk = { tab: 'make', form: RK_NEW(), sel: new Set(), q: '', open: {}, peekSid: '', detail: null, sure: false }); }
async function openRenraku(){
  const k = rkState(); k.detail = null; k.sure = false;
  app.innerHTML = rkHead() + '<div class="wrap"><div class="center" style="min-height:40vh"><div class="spinner"></div><div>名簿を読み込んでいます…</div></div></div>';
  window.scrollTo(0, 0);
  try{ const r = await api('renraku_init'); if (!r.ok) throw new Error(r.error); k.data = r; renderRenraku(); }
  catch(e){ app.innerHTML = rkHead() + '<div class="wrap"><div class="err">' + esc(String(e && e.message ? e.message : e)) + '</div></div>'; }
}
function rkHead(){
  const t = state.data.teacher, k = state.rk || {};
  return '<header class="top"><div class="in"><a class="back" href="#" onclick="state.peek=null;renderTeacher();return false;">‹ 先生用の画面にもどる</a>'
    + '<div class="school">鹿児島工学院専門学校　' + (t.職員 ? '職員用' : '先生用') + '</div><div class="who">保護者・学生への連絡</div>'
    + '<div class="meta">' + esc(t.氏名) + (k.data ? '　送れる範囲：' + esc(k.data.範囲) : '') + '</div></div></header>';
}
function rkAll(){ const out = []; (state.rk.data.クラス || []).forEach(c => c.学生.forEach(s => out.push(Object.assign({ クラス: c.クラス, 学科: c.学科 }, s)))); return out; }
function renderRenraku(){
  const k = state.rk, d = k.data;
  document.body.dataset.mode = 'teacher';
  const tabs = '<div class="seg" style="margin-bottom:4px"><button aria-pressed="' + (k.tab === 'make') + '" onclick="state.rk.tab=\'make\';state.rk.detail=null;renderRenraku()">新しい連絡</button>'
    + '<button aria-pressed="' + (k.tab === 'sent') + '" onclick="state.rk.tab=\'sent\';state.rk.detail=null;renderRenraku()">送った連絡（' + d.送った.length + '）</button></div>';
  let body;
  if (k.tab === 'sent') body = k.detail ? rkDetail() : rkSent();
  else body = rkMake();
  app.innerHTML = rkHead() + '<div class="wrap"><div class="card first" style="padding:10px 12px">' + tabs + '</div>' + body + footer() + '</div>';
  if (k.tab === 'make') rkPreview();
}
function seg(name, vals, cur, fn){
  return '<div class="seg">' + vals.map(v => '<button aria-pressed="' + (v === cur) + '" onclick="' + fn + '(\'' + v + '\')">' + v + '</button>').join('') + '</div>';
}
function rkSet(key, v){ const y = window.scrollY; state.rk.form[key] = v; state.rk.sure = false; renderRenraku(); window.scrollTo(0, y); }
function rkSetAite(v){ rkSet('相手', v); }
function rkSetShurui(v){ rkSet('種類', v); }
function rkMake(){
  const k = state.rk, f = k.form, d = k.data;
  const kind = card('flag', '送る相手と種類',
    '<div style="font-size:14px;margin-bottom:4px">送る相手</div>' + seg('相手', ['保護者', '学生', '両方'], f.相手, 'rkSetAite')
    + '<div style="font-size:14px;margin:12px 0 4px">種類</div>' + seg('種類', ['お知らせ', '緊急'], f.種類, 'rkSetShurui')
    + '<div class="note">' + (f.種類 === '緊急'
        ? '<b>緊急</b>は、夜でもすぐに届きます。休校など、本当に急ぐときだけ使ってください。LINEの文の頭に【緊急】が付きます。'
        : '<b>お知らせ</b>を夜（21:00〜7:00）に送ると、翌朝7:30ごろに届けます。') + '</div>');
  const to = card('list', '宛先（学生を選ぶ）', rkRoster());
  const text = card('doc', '連絡の文',
    '<div class="form"><label>タイトル<input id="rk_t" maxlength="60" placeholder="例：奨学金の書類の提出について" value="' + esc(f.タイトル) + '" oninput="state.rk.form.タイトル=this.value;state.rk.sure=false;rkPreview()"></label>'
    + '<label>本文<textarea id="rk_b" rows="7" maxlength="1500" style="display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px" placeholder="宛名（○○さんの保護者の方へ）と学校名・返信できない旨は自動で付きます" oninput="state.rk.form.本文=this.value;state.rk.sure=false;rkPreview()">' + esc(f.本文) + '</textarea></label>'
    + '<label class="chk" style="margin-top:10px"><input type="checkbox"' + (f.確認 ? ' checked' : '') + ' onchange="state.rk.form.確認=this.checked;state.rk.sure=false;rkPreview()"> 「確認しました」ボタンを付ける</label>'
    + '<div style="font-size:12.5px;color:var(--sub)">受け取った人のマイページにボタンが出て、確認した人・まだの人が「送った連絡」で分かります（書類の提出など）。</div></div>');
  const prev = card('bell', '送る前の確認', '<div id="rk_prev"></div>');
  return kind + to + text + prev;
}
function rkRoster(){
  const k = state.rk, d = k.data, q = k.q.trim(), f = k.form;
  const groups = (d.グループ || []).length
    ? '<div style="font-size:13.5px;margin-bottom:4px">グループから選ぶ（押すと、その学生を選んだ状態にします）</div><div class="chks" style="margin-bottom:10px">'
      + d.グループ.map((g, gi) => '<button class="mini" style="margin:0" onclick="rkGroup(' + gi + ')">' + esc(g.名前) + '（' + g.学籍番号.length + '）' + (g.共有 && !g.自分の ? '<small>・' + esc(g.先生) + '</small>' : '') + '</button>').join('') + '</div>'
    : '';
  const badge = s => {
    const b = [];
    if (f.相手 !== '学生') b.push(s.保護者 ? '<span class="rb ok">保' + s.保護者 + '</span>' : '<span class="rb no">保なし</span>');
    if (f.相手 !== '保護者') b.push(s.学生 ? '<span class="rb ok">学</span>' : '<span class="rb no">学なし</span>');
    return b.join('');
  };
  const cls = (d.クラス || []).map((c, ci) => {
    const list = c.学生.filter(s => !q || s.氏名.replace(/\s/g, '').indexOf(q.replace(/\s/g, '')) >= 0);
    if (q && !list.length) return '';
    const n = c.学生.filter(s => k.sel.has(s.sid)).length, all = n === c.学生.length;
    const open = q || (ci in k.open ? k.open[ci] : (n > 0 || d.クラス.length <= 2));   // 選んだ学生がいるクラスは開いておく
    return '<details class="rkcls"' + (open ? ' open' : '') + ' ontoggle="state.rk.open[' + ci + ']=this.open"><summary><span>' + esc(clsLabel(c.クラス)) + (d.全校 ? '<small> ' + esc(c.学科) + '</small>' : '') + '</span>'
      + '<span class="rkn' + (n ? ' on' : '') + '">' + n + '/' + c.学生.length + '人</span>'
      + '<button class="mini' + (all ? '' : ' on') + '" onclick="event.preventDefault();rkClass(' + ci + ',' + (!all) + ')">' + (all ? '全員外す' : '全員選ぶ') + '</button></summary>'
      + '<ul class="list">' + list.map(s => '<li class="rkrow"><label><input type="checkbox"' + (k.sel.has(s.sid) ? ' checked' : '') + ' onchange="rkToggle(\'' + esc(s.sid) + '\',this.checked)"><span>' + esc(s.氏名) + (s.休学 ? '<small>（休学中）</small>' : '') + '</span></label>'
        + badge(s) + '<button class="mini" onclick="rkPeekOpen(\'' + esc(s.sid) + '\')">画面</button>'
        + (k.peekSid === s.sid ? '<div class="rkpeek"><button class="mini on" onclick="rkPeek(\'' + esc(s.sid) + '\',\'保護者\')">保護者の画面を見る</button><button class="mini on" onclick="rkPeek(\'' + esc(s.sid) + '\',\'学生\')">学生の画面を見る</button></div>' : '')
        + '</li>').join('') + '</ul></details>';
  }).join('');
  const save = k.sel.size ? '<details class="done"><summary>選んだ' + k.sel.size + '人をグループとして保存</summary><div class="form">'
      + '<label>グループの名前<input id="rk_gn" maxlength="30" placeholder="例：奨学金（給付）の学生"></label>'
      + '<label class="chk" style="margin-top:8px"><input type="checkbox" id="rk_gs"> ' + (d.全校 ? '同じ部署（事務・管理職）の人と共有する' : '同じ学科の先生と共有する') + '</label>'
      + '<button class="btn ghost" style="margin-top:8px;padding:10px" onclick="rkGroupSave(this)">保存する</button></div></details>' : '';
  const mine = (d.グループ || []).filter(g => g.自分の);
  const manage = mine.length ? '<details class="done"><summary>自分のグループを消す</summary><div class="chks">' + mine.map(g => '<button class="mini" style="margin:0" onclick="rkGroupDel(\'' + esc(g.id) + '\',this)">' + esc(g.名前) + ' を消す</button>').join('') + '</div></details>' : '';
  return groups
    + '<div class="row2" style="margin-bottom:6px"><input id="rk_q" placeholder="名前でさがす" value="' + esc(k.q) + '" style="font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px" oninput="rkSearch(this.value)">'
    + '<button class="mini" onclick="state.rk.sel=new Set();state.rk.sure=false;rkReRoster()">選択を全部外す</button></div>'
    + '<div style="font-size:13.5px;margin-bottom:4px">選んだ学生：<b>' + k.sel.size + '人</b>　<span style="color:var(--sub);font-size:12.5px">保＝LINEに登録している保護者の数、学＝学生の登録</span></div>'
    + '<div id="rk_cls">' + (cls || '<div class="empty">名簿がありません。</div>') + '</div>' + save + manage;
}
function rkReRoster(){ const y = window.scrollY; renderRenraku(); window.scrollTo(0, y); }
let rkTimer = null;
function rkSearch(v){ state.rk.q = v; clearTimeout(rkTimer); rkTimer = setTimeout(() => { rkReRoster(); const i = document.getElementById('rk_q'); if (i){ i.focus(); i.setSelectionRange(v.length, v.length); } }, 300); }
function rkToggle(sid, on){ const k = state.rk; if (on) k.sel.add(sid); else k.sel.delete(sid); k.sure = false; rkReRoster(); }
function rkClass(ci, on){ const k = state.rk; k.data.クラス[ci].学生.forEach(s => on ? k.sel.add(s.sid) : k.sel.delete(s.sid)); k.open[ci] = true; k.sure = false; rkReRoster(); }
function rkGroup(gi){ const k = state.rk, g = k.data.グループ[gi]; k.sel = new Set(g.学籍番号); k.sure = false; rkReRoster(); toast('「' + g.名前 + '」の' + g.学籍番号.length + '人を選びました'); }
async function rkGroupSave(btn){
  const k = state.rk, name = document.getElementById('rk_gn').value.trim(), share = document.getElementById('rk_gs').checked;
  if (!name) return toast('グループの名前を入れてください', true);
  btn.disabled = true;
  try{ const r = await api('renraku_group_save', { 名前: name, 共有: share, sids: [...k.sel] }); if (!r.ok) throw new Error(r.error);
    const r2 = await api('renraku_init'); if (r2.ok) k.data = r2; rkReRoster(); toast(r.message); }
  catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}
async function rkGroupDel(id, btn){
  if (btn.dataset.sure !== '1'){ btn.dataset.sure = '1'; btn.textContent = 'もう一度押すと消します'; return; }
  btn.disabled = true;
  try{ const r = await api('renraku_group_delete', { id }); if (!r.ok) throw new Error(r.error);
    const r2 = await api('renraku_init'); if (r2.ok) state.rk.data = r2; rkReRoster(); toast(r.message); }
  catch(e){ btn.disabled = false; toast(String(e && e.message ? e.message : e), true); }
}
function rkPeekOpen(sid){ const k = state.rk; k.peekSid = k.peekSid === sid ? '' : sid; rkReRoster(); }
async function rkPeek(sid, kind){
  toast('画面を読み込んでいます…');
  try{ const r = await api('peek', { sid, 種別: kind }); if (!r.ok) throw new Error(r.error);
    state.peek = { person: r.person, 公開: r.公開, kind }; renderMypage(); }
  catch(e){ toast(String(e && e.message ? e.message : e), true); }
}
function exitPeek(){ state.peek = null; renderRenraku(); }
// 送る前の確認（届く数・未登録の人・LINEの文）
function rkPreview(){
  const el = document.getElementById('rk_prev'); if (!el) return;
  const k = state.rk, f = k.form, d = k.data;
  const sel = rkAll().filter(s => k.sel.has(s.sid));
  const toP = f.相手 !== '学生', toS = f.相手 !== '保護者';
  const pLine = sel.reduce((t, s) => t + s.保護者, 0), sLine = sel.filter(s => s.学生).length;
  const noP = toP ? sel.filter(s => !s.保護者) : [], noS = toS ? sel.filter(s => !s.学生) : [];
  const n = (toP ? pLine : 0) + (toS ? sLine : 0);
  const q = d.通数;
  const over = q && q.上限 != null && q.使った + n > q.上限;
  const h = new Date().getHours(), night = f.種類 !== '緊急' && (h < 7 || h >= 21);
  let html = '<div style="font-size:14.5px">選んだ学生：<b>' + sel.length + '人</b><br>届くLINE：'
    + (toP ? '保護者 <b>' + pLine + '通</b>' : '') + (toP && toS ? '・' : '') + (toS ? '学生 <b>' + sLine + '通</b>' : '')
    + '<span style="font-size:12.5px;color:var(--sub)">（きょうだいは1通にまとめるので、少し減ることがあります）</span></div>';
  if (noP.length || noS.length){
    html += '<div class="plan warn">LINEに登録していないため届かない人がいます。電話や紙でお知らせください。'
      + (noP.length ? '<details><summary>保護者が未登録：' + noP.length + '人</summary>' + noP.map(s => esc(s.氏名)).join('、') + '</details>' : '')
      + (noS.length ? '<details><summary>学生が未登録：' + noS.length + '人</summary>' + noS.map(s => esc(s.氏名)).join('、') + '</details>' : '') + '</div>';
  }
  if (q) html += '<div style="font-size:12.5px;color:' + (over ? 'var(--red)' : 'var(--sub)') + ';margin-top:6px">LINEの今月の送信数：' + q.使った + '通' + (q.上限 != null ? '／上限' + q.上限 + '通（あと' + Math.max(0, q.上限 - q.使った) + '通）' : '') + '</div>';
  if (sel.length && (f.タイトル || f.本文)){
    const s0 = sel[0], who = (f.相手 === '学生' ? s0.氏名 + 'さんへ' : s0.氏名 + 'さんの保護者の方へ');
    const text = '【鹿児島工学院専門学校】' + (f.種類 === '緊急' ? '【緊急】' : '') + '\n' + f.タイトル + '\n\n' + who + '\n' + f.本文 + '\n\n（' + d.差出人 + '）\n'
      + (f.確認 ? '▼お読みになったら、マイページで「確認しました」を押してください\n' : '▼マイページでも見られます\n') + '（マイページのリンク）\n※このメッセージには返信できません。'
      + (f.相手 === '学生' ? '用件は担任の先生へ。' : 'ご用件は、学校（' + TEL + '／平日8:30〜17:00）へお電話ください。');
    html += '<div style="font-size:13px;margin-top:10px;color:var(--sub)">届くLINEの文（' + esc(s0.氏名) + 'さんの' + (f.相手 === '学生' ? '' : '保護者の') + '例）</div><div class="bubble">' + esc(text) + '</div>';
  }
  const ready = sel.length && f.タイトル.trim() && f.本文.trim() && n > 0 && !over;
  html += (night ? '<div class="note">今は夜なので、明日の朝7:30ごろに届けます。</div>' : '')
    + '<button class="btn" id="rk_go" style="margin-top:12px' + (k.sure ? ';background:var(--red)' : '') + '"' + (ready ? '' : ' disabled') + ' onclick="rkSend(this)">'
    + (k.sure ? 'もう一度押すと送ります（' + n + '通）' : (f.種類 === '緊急' ? '緊急の連絡を送る' : '連絡を送る')) + '</button>'
    + '<div style="font-size:12.5px;color:var(--sub);margin-top:6px">送ったLINEは取り消せません。宛先と文をよく確かめてください。</div>';
  el.innerHTML = html;
}
async function rkSend(btn){
  const k = state.rk, f = k.form;
  if (!k.sure){ k.sure = true; rkPreview(); return; }
  btn.disabled = true; btn.textContent = '送っています…';
  try{
    const r = await api('renraku_send', { 種類: f.種類, 相手: f.相手, タイトル: f.タイトル, 本文: f.本文, 確認: f.確認, sids: [...k.sel] });
    if (!r.ok) throw new Error(r.error);
    k.form = RK_NEW(); k.sel = new Set(); k.sure = false; k.tab = 'sent';
    const r2 = await api('renraku_init'); if (r2.ok) k.data = r2;
    renderRenraku(); window.scrollTo(0, 0); toast(r.message);
  }catch(e){ k.sure = false; rkPreview(); toast(String(e && e.message ? e.message : e), true); }
}
// 送った連絡
function rkSent(){
  const list = state.rk.data.送った || [];
  if (!list.length) return card('list', '送った連絡', '<div class="empty">まだ送った連絡はありません。</div>');
  return card('list', '送った連絡', '<ul class="list">' + list.map((x, i) => '<li style="cursor:pointer" onclick="rkOpenDetail(\'' + esc(x.id) + '\')"><span class="date">' + esc(x.日時.replace(/（.*?）/, '')) + '</span>'
    + '<span class="body">' + (x.種類 === '緊急' ? '<span class="tag t-欠席" style="margin-right:4px">緊急</span>' : '') + esc(x.タイトル)
    + '<div class="s">' + esc(x.相手) + '・' + x.人数 + '人 → ' + (x.状態 === '朝に送る' ? '明日の朝に届けます' : x.送った数 + '通' + (x.届かなかった数 ? '（届かず' + x.届かなかった数 + '）' : '')) + (x.自分の ? '' : '　送った人：' + esc(x.先生)) + '</div></span>'
    + (x.確認つき ? '<span class="tag ' + (x.確認数 >= x.人数 ? 't-済' : 't-確認中') + '">確認 ' + x.確認数 + '/' + x.人数 + '</span>' : '') + '</li>').join('') + '</ul>'
    + '<div style="font-size:12.5px;color:var(--sub);margin-top:6px">押すと、誰に届いたか・確認したかが見られます。</div>');
}
async function rkOpenDetail(id){
  toast('読み込んでいます…');
  try{ const r = await api('renraku_detail', { id }); if (!r.ok) throw new Error(r.error); state.rk.detail = Object.assign({ id }, r); renderRenraku(); window.scrollTo(0, 0); }
  catch(e){ toast(String(e && e.message ? e.message : e), true); }
}
function rkDetail(){
  const x = state.rk.detail, c = x.連絡, toP = c.相手 !== '学生', toS = c.相手 !== '保護者';
  const st = (reg, ok) => !reg ? '<span class="rb no">未登録</span>' : !c.確認つき ? '<span class="rb ok">届いた</span>' : ok ? '<span class="rb ok">確認済み</span>' : '<span class="rb wait">まだ</span>';
  const yet = [];
  const rows = x.クラス.map(k => '<div class="cls">' + esc(clsLabel(k.クラス)) + '</div><ul class="list">' + k.学生.map(s => {
      const pOk = !!s.確認.保護者, sOk = !!s.確認.学生;
      if (c.確認つき && !((toP && pOk) || (toS && sOk))) yet.push(s.sid);
      return '<li><span class="body">' + esc(s.氏名) + '</span>' + (toP ? '<span class="s" style="font-size:12px">保護者</span>' + st(s.保護者, pOk) : '') + (toS ? '<span class="s" style="font-size:12px">学生</span>' + st(s.学生, sOk) : '') + '</li>';
    }).join('') + '</ul>').join('');
  state.rk.yet = yet;
  return card('doc', c.タイトル, '<div class="note" style="margin-top:0">' + esc(c.日時) + '　' + esc(c.種類) + '　' + esc(c.相手) + '<br>送った人：' + esc(c.先生) + '　状態：' + esc(c.状態) + '（' + c.送った数 + '通）</div>'
      + '<div class="bubble" style="margin-top:8px">' + esc(c.本文) + '</div>'
      + (c.確認つき && yet.length ? '<button class="btn ghost" style="margin-top:10px;padding:10px" onclick="rkResend()">まだ確認していない' + yet.length + '人に、もう一度送る文を作る</button>' : ''))
    + card('list', '届いた人・確認した人', rows || '<div class="empty">見られる学生がいません。</div>')
    + '<a class="link" href="#" onclick="state.rk.detail=null;renderRenraku();return false;">送った連絡の一覧にもどる</a>';
}
function rkResend(){
  const k = state.rk, c = k.detail.連絡;
  k.form = { 種類: c.種類, 相手: c.相手, タイトル: '【再送】' + c.タイトル, 本文: c.本文, 確認: true };
  k.sel = new Set(k.yet || []); k.tab = 'make'; k.detail = null; k.sure = false;
  renderRenraku(); window.scrollTo(0, 0); toast('まだ確認していない人を選びました。文を確かめて送ってください');
}

function toast(text, bad){
  const t = document.createElement('div'); t.className = 'refresh'; t.textContent = text;
  if (bad) t.style.background = '#c8453c';
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2200);
}

function footer(){
  return '<footer>このページへのご質問は、学校の窓口へお電話ください。<br>'
    + '<a href="tel:' + TEL + '">' + TEL + '</a>（平日8:30〜17:00）'
    + '<div style="margin-top:8px;font-size:11px;color:#9aa5b1">画面の版：2026-11-19 版46' + (window.__ver ? '／データ係：' + esc(window.__ver) : '') + '</div></footer>';
}

/* ---------- はじまり ---------- */
liff.init({ liffId: LIFF_ID }).then(() => {
  if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
  load();
}).catch(() => showError('LINEの準備ができませんでした。LINEアプリから開き直してください。'));
